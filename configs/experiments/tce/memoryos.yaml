users:
  - 001_user_001

runtime:
  baseline: memoryos
  experiment_name: memoryos_v14_user1_azure
  run_id: main
  resume: true
  debug: false
  save_prompt_and_raw: true
  enable_change_reasoning: true
  enable_rq3_apply_service_qa: true
  rq3_apply_save_prompt_and_raw: true
  checkpoint_workers: 1
  within_checkpoint_workers: 1
  save_every_generation_keys: 5

data:
  benchmark: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/tce_benchmark_vnext_20260319_formal_crv_task_packs_v14.json
  app_logs_path: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: results/MemoryOS/results/{user_id}/prediction/{run_name}/tce_results_v14_taskabc.json

llm:
  provider: azure
  model: gpt-5-mini
  max_workers: 1
  temperature: null

retriever:
  provider: azure
  model: text-embedding-3-large

retrieval:
  top_k: 20
  rq3_apply_top_k: 20
  final_qa_top_k: 20

final_qa:
  enabled: true
  save_prompt_and_raw: true

baseline_params:
  size: large
  snapshot_dir: results/MemoryOS/snapshots/{run_name}
  data_storage_path: results/MemoryOS/runtime_data/{run_name}
  llm_controller_model: gpt-5-mini
  assistant_id: assistant
