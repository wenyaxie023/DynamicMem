users:
  - 001_user_001

runtime:
  baseline: hipporag2
  experiment_name: hipporag2_user1_taskc_only_20260423_5ckpt
  task_selection: task_c_only
  resume: true
  debug: false
  save_prompt_and_raw: true
  enable_change_reasoning: false
  enable_rq3_apply_service_qa: true
  rq3_apply_save_prompt_and_raw: true
  checkpoint_workers: 4
  within_checkpoint_workers: 4
  save_every_generation_keys: 5
  max_checkpoints: 5

data:
  benchmark: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/tce_benchmark_vnext_20260423_taskc_v2_rubric_rewrite_from_state_validated.json
  app_logs_path: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: results/HippoRAG2/results/{user_id}/prediction/{run_name}/tce_results_taskc_only_5ckpt.json

llm:
  provider: azure
  model: gpt-5-mini
  max_workers: 4

retriever:
  provider: azure
  model: text-embedding-3-large
  batch_size: 64

retrieval:
  top_k: 20
  rq3_apply_top_k: 20

final_qa:
  enabled: false
  save_prompt_and_raw: false

baseline_params:
  snapshot_dir: results/HippoRAG2/snapshots/hipporag2_build_only/{user_id}
  data_storage_path: results/HippoRAG2/runtime_data/hipporag2_build_only/{user_id}
  builder_save_every_logs: 64
  allow_destructive_rebuild: false
