users:
  - 001_user_001

runtime:
  baseline: amem
  experiment_name: amem_build_only
  run_id: main
  resume: true

data:
  benchmark: outputs/gemini_3_flash_preview/{user_id}/tce_benchmark_vnext_20260319_formal_crv_task_packs_v14.json
  app_logs_path: outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: results/Amem/results/{user_id}/prediction/{run_name}/build_only.json

llm:
  provider: azure
  model: gpt-5-mini

retriever:
  provider: azure
  model: text-embedding-3-large

baseline_params:
  memory_action: build_only
  size: large
  snapshot_dir: results/Amem/snapshots/{run_name}
  data_storage_path: results/Amem/runtime_data/{run_name}/{user_id}
  save_every: 5
