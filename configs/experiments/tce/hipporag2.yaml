users:
  - 001_user_001

runtime:
  baseline: hipporag2
  experiment_name: hipporag2_user1_v14_top20_azure_buildonly_cp1_save64
  resume: false
  debug: false
  save_prompt_and_raw: true
  enable_change_reasoning: true
  enable_rq3_apply_service_qa: true
  rq3_apply_save_prompt_and_raw: true
  checkpoint_workers: 4
  within_checkpoint_workers: 4
  save_every_generation_keys: 5

data:
  benchmark: data_construction/generated_outputs/gemini_3_flash_preview/001_user_001/tce_benchmark_vnext_20260319_formal_crv_task_packs_v14.json
  app_logs_path: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: results/HippoRAG2/results/{user_id}/prediction/{experiment_name}/tce_results_v14_taskabc.json

llm:
  provider: azure
  model: gpt-5-mini
  max_workers: 4

retriever:
  provider: azure
  model: text-embedding-3-large
  batch_size: 64

retrieval:
  top_k: 20
  rq3_apply_top_k: 20
  final_qa_top_k: 5

final_qa:
  enabled: true
  save_prompt_and_raw: true

baseline_params:
  save_dir: results/HippoRAG2/outputs/{user_id}/{run_name}
  builder_save_every_logs: 64
