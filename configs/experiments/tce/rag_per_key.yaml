users:
  - 001_user_001

runtime:
  baseline: rag
  auto_build_benchmark: true
  resume: false
  debug: false
  save_prompt_and_raw: true
  max_checkpoints: 10

data:
  benchmark: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/tce_benchmark.json
  app_logs_path: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: generation/rag/results/{user_id}/prediction/tce_results_topk5_perkey_impl.json

llm:
  provider: openai
  model: gpt-5-mini
  max_workers: 1

baseline_params:
  retrieval_top_k: 5
  retriever_provider: openai
  retriever_model: text-embedding-3-large
  retriever_batch_size: 64
  predict_per_key: true
