users:
  - 001_user_001

runtime:
  baseline: oracle
  experiment_name: predict0504v2_formal
  run_id: main
  resume: true
  within_checkpoint_workers: 4
  enable_change_reasoning: false
  enable_rq3_apply_service_qa: true
  save_prompt_and_raw: true
  rq3_apply_save_prompt_and_raw: true


data:
  benchmark: outputs/gemini_3_flash_preview/{user_id}/tce_benchmark_vnext_20260504v2_formal_task_packs_human_revised.json
  app_logs_path: outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: results/Oracle/results/{user_id}/prediction/{run_name}/tce_results.json

llm:
  provider: azure
  model: gpt-5-mini
  max_workers: 4

retriever:
  provider: azure
  model: text-embedding-3-large
  batch_size: 64

retrieval:
  top_k: 10
  rq3_apply_top_k: 10

final_qa:
  enabled: false

baseline_params: {}
