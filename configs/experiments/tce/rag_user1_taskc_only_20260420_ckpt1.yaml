users:
  - 001_user_001

runtime:
  baseline: rag
  experiment_name: rag_user1_taskc_only_20260420_ckpt1_azure
  task_selection: task_c_only
  resume: false
  debug: false
  save_prompt_and_raw: true
  enable_change_reasoning: false
  enable_rq3_apply_service_qa: true
  rq3_apply_save_prompt_and_raw: true
  checkpoint_workers: 4
  within_checkpoint_workers: 4
  save_every_generation_keys: 5
  max_checkpoints: 1

data:
  benchmark: outputs/gemini_3_flash_preview/001_user_001/tce_benchmark_vnext_20260420_taskc_v2_clean_from_state_validated.json
  app_logs_path: outputs/gemini_3_flash_preview/001_user_001/app_log_large.json

output:
  prediction_path: baseline_prediction/rag/results/001_user_001/prediction/{experiment_name}/tce_results_taskc_only_ckpt1.json

llm:
  provider: azure
  model: gpt-5-mini
  max_workers: 4

retriever:
  provider: azure
  model: text-embedding-3-large
  batch_size: 64

retrieval:
  top_k: 20
  rq3_apply_top_k: 20

final_qa:
  enabled: false
  save_prompt_and_raw: false
