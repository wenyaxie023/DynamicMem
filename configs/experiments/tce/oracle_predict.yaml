users:
  - 001_user_001

runtime:
  baseline: oracle
  experiment_name: predict0504v2_formal
  run_id: main
  resume: true
  within_checkpoint_workers: 4
  enable_rq3_apply_service_qa: true


data:
  benchmark: outputs/{user_id}/task_packs.json
  app_logs_path: outputs/{user_id}/app_log_large.json

output:
  prediction_path: results/Oracle/results/{user_id}/prediction/{run_name}/tce_results.json

llm:
  provider: openai
  model: gpt-5-mini
  max_workers: 4

retriever:
  provider: openai
  model: text-embedding-3-large
  batch_size: 64

retrieval:
  top_k: 10
  rq3_apply_top_k: 10

final_qa:
  enabled: false

baseline_params: {}
