users:
  - 001_user_001

runtime:
  baseline: letta
  experiment_name: letta_v14_user1_local_selfhost_ctx16k_h8k
  run_id: main
  resume: false
  debug: false
  save_prompt_and_raw: true
  enable_change_reasoning: true
  enable_rq3_apply_service_qa: true
  checkpoint_workers: 1
  within_checkpoint_workers: 1

data:
  benchmark: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/tce_benchmark_vnext_20260319_formal_crv_task_packs_v14.json
  app_logs_path: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: generation/letta/results/{user_id}/prediction/{run_name}/tce_results_v14_taskabc.json

llm:
  provider: azure
  model: azure/gpt-5-mini
  max_workers: 1

final_qa:
  enabled: false
  save_prompt_and_raw: false

baseline_params:
  embedding: azure/text-embedding-3-large
  context_window_limit: 16000
  human_block_limit_chars: 8000
  client_timeout_seconds: 600
  letta_mode: sdk
  allow_local_fallback: false
  query_isolation_mode: checkpoint_snapshot
  checkpoint_agents_dir: generation/letta/agents/{run_name}/{user_id}
