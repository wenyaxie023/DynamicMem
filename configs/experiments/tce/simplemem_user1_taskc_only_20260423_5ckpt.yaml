users:
  - 001_user_001

runtime:
  baseline: simplemem
  experiment_name: simplemem_user1_taskc_only_20260423_5ckpt
  task_selection: task_c_only
  resume: true
  debug: false
  save_prompt_and_raw: true
  enable_change_reasoning: false
  enable_rq3_apply_service_qa: true
  rq3_apply_save_prompt_and_raw: true
  checkpoint_workers: 1
  within_checkpoint_workers: 1
  save_every_generation_keys: 5
  max_checkpoints: 5

data:
  benchmark: outputs/gemini_3_flash_preview/{user_id}/tce_benchmark_vnext_20260423_taskc_v2_rubric_rewrite_from_state_validated.json
  app_logs_path: outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: results/simplemem/results/{user_id}/prediction/{run_name}/tce_results_taskc_only_5ckpt.json

llm:
  provider: azure
  model: gpt-5-mini
  max_workers: 1

retriever:
  provider: azure
  model: text-embedding-3-large
  batch_size: 64

retrieval:
  top_k: 20
  rq3_apply_top_k: 20

final_qa:
  enabled: false
  save_prompt_and_raw: false

baseline_params:
  snapshot_dir: results/simplemem/snapshots/simplemem_build_only/{user_id}
  data_storage_path: results/simplemem/runtime_data/simplemem_build_only/{user_id}
  allow_destructive_rebuild: false
  builder_llm_temperature: 0.1
  window_size: 5
  overlap_size: 1
  save_every_logs: 5
  semantic_top_k: 20
  keyword_top_k: 20
  structured_top_k: 20
  enable_parallel_processing: false
  max_parallel_workers: 1
  enable_planning: true
  enable_reflection: true
  max_reflection_rounds: 2
  enable_parallel_retrieval: false
  max_retrieval_workers: 1
