users:
  - 001_user_001

runtime:
  baseline: memoryos
  experiment_name: memoryos_v14_user1_azure_build_only_raw
  run_id: main
  resume: true
  save_every_generation_keys: 50

data:
  benchmark: outputs/gemini_3_flash_preview/{user_id}/tce_benchmark_vnext_raw.json
  app_logs_path: outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: results/MemoryOS/results/{user_id}/prediction/{run_name}/build_only.json

llm:
  provider: azure
  model: gpt-5-mini

retriever:
  provider: azure
  model: text-embedding-3-large

retrieval:
  top_k: 20

baseline_params:
  size: large
  snapshot_dir: results/MemoryOS/snapshots/{run_name}
  data_storage_path: results/MemoryOS/runtime_data/{run_name}
  llm_controller_model: gpt-5-mini
  assistant_id: assistant
  build_only: true
