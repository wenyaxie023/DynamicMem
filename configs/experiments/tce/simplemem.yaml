users:
  - 001_user_001
  - 002_user_002
  - 003_user_003

runtime:
  baseline: simplemem
  resume: false
  debug: true
  save_prompt_and_raw: true
  max_checkpoints: 3

data:
  benchmark: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/tce_benchmark.json
  app_logs_path: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: generation/simplemem/results/{user_id}/prediction/tce_results.json

llm:
  provider: openai
  model: gpt-5-mini
  max_workers: 1

baseline_params:
  retrieval_top_k: 10
  embedding_model: text-embedding-3-large
  batch_size: 64
  preprocess_workers: 4
  enable_parallel_preprocess: true
  checkpoint_workers: 1
  within_checkpoint_workers: 1
