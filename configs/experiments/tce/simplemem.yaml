users:
  - 001_user_001

runtime:
  baseline: simplemem
  experiment_name: simplemem_v14_user1
  run_id: main
  resume: true
  debug: false
  save_prompt_and_raw: true
  enable_change_reasoning: true
  enable_rq3_apply_service_qa: true
  rq3_apply_save_prompt_and_raw: true
  checkpoint_workers: 1
  within_checkpoint_workers: 1
  save_every_generation_keys: 5

data:
  benchmark: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/tce_benchmark_vnext_20260319_formal_crv_task_packs_v14.json
  app_logs_path: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: generation/simplemem/results/{user_id}/prediction/{run_name}/tce_results_v14_taskabc.json

llm:
  provider: openai
  model: gpt-5-mini
  max_workers: 1
  temperature: null

retriever:
  provider: openai
  model: text-embedding-3-large
  batch_size: 64

retrieval:
  top_k: 20
  rq3_apply_top_k: 20
  final_qa_top_k: 20

final_qa:
  enabled: true
  save_prompt_and_raw: true

baseline_params:
  builder_llm_temperature: 0.1
  window_size: 5
  overlap_size: 1
  save_every_logs: 5
  semantic_top_k: 20
  keyword_top_k: 20
  structured_top_k: 20
  enable_planning: true
  enable_reflection: true
  max_reflection_rounds: 2
  enable_parallel_processing: false
  max_parallel_workers: 1
  enable_parallel_retrieval: false
  max_retrieval_workers: 1
