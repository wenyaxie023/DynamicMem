users:
  - 001_user_001

runtime:
  baseline: hipporag2
  experiment_name: hipporag2_build_only
  run_id: main
  resume: true

data:
  benchmark: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/tce_benchmark_vnext_20260319_formal_crv_task_packs_v14.json
  app_logs_path: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: results/HippoRAG2/results/{user_id}/prediction/{run_name}/build_only.json

llm:
  provider: azure
  model: gpt-5-mini

retriever:
  provider: azure
  model: text-embedding-3-large
  batch_size: 64

baseline_params:
  snapshot_dir: results/HippoRAG2/snapshots/{run_name}/{user_id}
  data_storage_path: results/HippoRAG2/runtime_data/{run_name}/{user_id}
  builder_save_every_logs: 64
  openie_max_workers: 64
  build_only: true
