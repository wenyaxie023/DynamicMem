users:
  - 001_user_001

runtime:
  baseline: hipporag2
  experiment_name: hipporag2_smoke3
  resume: false
  debug: true
  save_prompt_and_raw: true
  enable_change_reasoning: true
  enable_rq3_apply_service_qa: true
  rq3_apply_save_prompt_and_raw: true
  max_checkpoints: 3

data:
  benchmark: results/HippoRAG2/smoke3/{user_id}/tce_benchmark_3cp_task_packs_vnext_20260310.json
  app_logs_path: results/HippoRAG2/smoke3/{user_id}/app_log_upto_cp3.json

output:
  prediction_path: results/HippoRAG2/results_smoke3/{user_id}/prediction/{experiment_name}/tce_results_v14_taskabc.json

llm:
  provider: azure
  model: gpt-5-mini
  max_workers: 1

retriever:
  model: text-embedding-3-large
  batch_size: 20

retrieval:
  top_k: 50
  rq3_apply_top_k: 50
  final_qa_top_k: 5

final_qa:
  enabled: false
  save_prompt_and_raw: false

baseline_params:
  save_dir: results/HippoRAG2/outputs_smoke3/{user_id}_online
  builder_save_every_logs: 5
