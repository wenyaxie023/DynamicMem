users:
  - 001_user_001

runtime:
  baseline: simplemem
  experiment_name: simplemem_build_only
  run_id: main
  resume: true

data:
  benchmark: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/tce_benchmark_vnext_20260319_formal_crv_task_packs_v14.json
  app_logs_path: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: results/simplemem/results/{user_id}/prediction/{run_name}/build_only.json

llm:
  provider: openai
  model: gpt-5-mini

retriever:
  provider: openai
  model: text-embedding-3-large

baseline_params:
  snapshot_dir: results/simplemem/snapshots/{run_name}/{user_id}
  data_storage_path: results/simplemem/runtime_data/{run_name}/{user_id}
  build_only: true
  allow_destructive_rebuild: true
