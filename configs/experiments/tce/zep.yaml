users:
  - user_001

runtime:
  baseline: zep
  resume: false
  debug: true
  save_prompt_and_raw: true
  max_checkpoints: 1

data:
  benchmark: user_data/tce/tce_benchmark_vnext_20260319_formal_crv_task_packs_v14.json
  app_logs_path: user_data/001_user_001/app_log_large.json

output:
  prediction_path: generation/zep/results/{user_id}/prediction/tce_results.json

llm:
  provider: openai
  model: gpt-5-mini
  max_workers: 1

baseline_params:
  embedding_model: text-embedding-3-large
  batch_size: 1
  max_coroutines: 1
  checkpoint_workers: 1
  within_checkpoint_workers: 1
  save_every_generation_keys: 1
