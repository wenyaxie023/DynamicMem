users:
  - 001_user_001

runtime:
  baseline: zep
  resume: true
  debug: true
  save_prompt_and_raw: true
  max_checkpoints: 1
  checkpoint_workers: 1
  within_checkpoint_workers: 1
  save_every_generation_keys: 1

data:
  benchmark: outputs/gemini_3_flash_preview/{user_id}/tce_benchmark_vnext_20260319_formal_crv_task_packs_v14.json
  app_logs_path: outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: baseline_prediction/zep/results/{user_id}/prediction/tce_results_v14_taskabc.json

llm:
  provider: azure
  model: gpt-5-mini
  max_workers: 1

retriever:
  provider: azure
  model: text-embedding-3-large
  batch_size: 10

retrieval:
  top_k: 5

baseline_params:
  max_coroutines: 1
