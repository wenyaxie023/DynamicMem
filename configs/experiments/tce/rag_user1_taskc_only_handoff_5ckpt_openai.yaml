# Handoff config for running the RAG baseline on TCE v2 Task C only.
# Place the required input files under the repo root before running:
#   handoff_inputs/tce_benchmark_taskc_v2.json
#   handoff_inputs/app_log_large.json
#
# Benchmark pack Google Drive link:
#   <PASTE_GOOGLE_DRIVE_LINK_FOR_TCE_V2_TASKC_PACK_JSON_HERE>
#
# App logs Google Drive link:
#   <PASTE_GOOGLE_DRIVE_LINK_FOR_APP_LOG_LARGE_JSON_HERE>

users:
  - 001_user_001

runtime:
  baseline: rag
  experiment_name: rag_user1_taskc_only_handoff_5ckpt_openai
  task_selection: task_c_only
  resume: false
  debug: false
  save_prompt_and_raw: false
  enable_change_reasoning: false
  enable_rq3_apply_service_qa: true
  rq3_apply_save_prompt_and_raw: false
  checkpoint_workers: 1
  within_checkpoint_workers: 4
  save_every_generation_keys: 5
  max_checkpoints: 5

data:
  benchmark: handoff_inputs/tce_benchmark_taskc_v2.json
  app_logs_path: handoff_inputs/app_log_large.json

output:
  prediction_path: generation/rag/results/001_user_001/prediction/{experiment_name}/tce_results_taskc_only_5ckpt.json

llm:
  provider: openai
  model: gpt-5-mini
  max_workers: 4

retriever:
  provider: openai
  model: text-embedding-3-large
  batch_size: 64

retrieval:
  top_k: 20
  rq3_apply_top_k: 20

final_qa:
  enabled: false
  save_prompt_and_raw: false
