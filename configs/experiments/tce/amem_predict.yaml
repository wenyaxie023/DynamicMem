users:
  - 001_user_001

runtime:
  baseline: amem
  experiment_name: predict0504v2_formal_5
  run_id: main
  resume: true
  within_checkpoint_workers: 4
  enable_rq3_apply_service_qa: true

data:
  benchmark: outputs/{user_id}/task_packs.json
  app_logs_path: outputs/{user_id}/app_log_large.json

output:
  prediction_path: results/Amem/results/{user_id}/prediction/{run_name}/tce_results.json

llm:
  provider: openai
  model: gpt-5-mini
  max_workers: 4

retriever:
  provider: openai
  model: text-embedding-3-large

retrieval:
  top_k: 5
  rq3_apply_top_k: 5

baseline_params:
  memory_action: build_then_predict
  size: large
  linked_neighbor_top_k: 5
  snapshot_dir: results/Amem/snapshots/amem_build_only
  data_storage_path: results/Amem/runtime_data/amem_build_only/{user_id}
