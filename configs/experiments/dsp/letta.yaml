users:
  - 001_user_001
  - 002_user_002
  - 003_user_003

runtime:
  baseline: letta
  resume: false
  debug: false
  save_prompt_and_raw: true

data:
  benchmark: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/dynamic_state_prediction_benchmark.json
  app_logs_path: data_construction/generated_outputs/gemini_3_flash_preview/{user_id}/app_log_large.json

output:
  prediction_path: generation/letta/results/{user_id}/prediction/dynamic_state_prediction_results.json

llm:
  provider: openai
  model: gpt-5-mini
  max_workers: 1

baseline_params:
  retrieval_top_k: 10
  letta_mode: sdk
  allow_local_fallback: true
  checkpoint_state_path: ""
