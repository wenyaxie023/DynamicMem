runtime:
  enable_change_reasoning: true
  enable_rq3_apply_service_qa: true
  rq3_apply_save_prompt_and_raw: true
  checkpoint_workers: 1
  within_checkpoint_workers: 1
  save_every_generation_keys: 1

llm:
  provider: openai
  model: gpt-5-mini
  max_workers: 1
  temperature: 0.0
  top_p: 1.0
  top_k: null

retriever:
  provider: openai
  model: text-embedding-3-large
  batch_size: 64

retrieval:
  top_k: 5
  rq3_apply_top_k: null
  final_qa_top_k: 5

final_qa:
  enabled: false
  save_prompt_and_raw: false
