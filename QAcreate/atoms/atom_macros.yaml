version: 1

rules:
  # ---------------------------------------------------------
  # State Changes: 提取用户属性、习惯或偏好的变更事实
  # ---------------------------------------------------------
  - id: state_item.any
    match: windows_by_id.*.event_chains.*.related_state_items.*
    emit:
      domain: "#*./state_category"
      anchor: "#*./state_name"
      key: "#*./state_name"
      value: "#*"
      time_window: "#*../../../../window_id"

  # ---------------------------------------------------------
  # Events: 提取用户具体发生的行为事件事实
  # ---------------------------------------------------------
  - id: event.any
    match: windows_by_id.*.event_chains.*.events.*
    emit:
      domain: "event"
      anchor: "#*./event_id"
      key: "#*./event_id"
      value: "#*"
      time_window: "#*../../../../window_id"

