# Default DynamicMem environment.
#
# Lightweight: supports trajectory synthesis (Part 1), benchmark construction
# (Part 2), evaluation (Part 4), and the rag / oracle / simplemem baselines —
# none of which need a local GPU/embedding stack (they use API embeddings).
#
#   conda env create -f environment/default.yml
#   conda activate dynamicmem
#   pip install -e .
#
# Extra setup for the remaining baselines:
#   - amem:       pip install -r baseline_prediction/Amem/requirements.txt   (torch / sentence-transformers / chromadb)
#   - memoryos:   conda env create -f environment/memoryos.yml
#   - hipporag2:  conda env create -f environment/hipporag2.yml
name: dynamicmem
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - openai>=2.8
      - pydantic>=2.10
      - pyyaml>=6
      - numpy>=1.26
      - tiktoken>=0.7
      - tqdm>=4.66
      - python-dotenv>=1.0
      - requests>=2.31
      - jinja2>=3.1
      - huggingface_hub>=0.23
      - datasets>=2.19
      - google-genai>=1.0
      - google-generativeai>=0.8
